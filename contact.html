  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <button
          class="navbar-toggler"
          type="button"
          data-toggle="collapse"
          data-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"

        </button>

        <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">

    <!-- Optional top image (keep if you have it) -->
    <div id="form-top-image">
      <img
        src="assets/images/form-images/muscles-orenessresize.jpeg"
        alt="Man experiencing muscle soreness"
      />
    </div>

    <main>
      <section class="ss-form">
        <div class="ss-form__header">
          <h1 class="ss-form__title">Request a booking</h1>
          <p class="ss-form__lead">
            Send a quick note and I’ll get back to you.
          </p>
        </div>

        <form id="ssBookingForm" novalidate>
          <div class="form-group">
            <label for="name">Name *</label>
            <input id="name" name="name" type="text" autocomplete="name" required />
          </div>

          <div class="form-group">
            <label for="email">Email *</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>

          <div class="form-group">
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" />
          </div>

          <div class="form-group">
            <label for="message">Message *</label>
            <textarea id="message" name="message" required></textarea>
          </div>

          <button id="ssSubmit" type="submit">Send</button>

          <p id="ssStatus" aria-live="polite"></p>
        </form>
      </section>

      <!-- Contact block (simple + clean) -->
      <section class="ss-contact-card">
        <h2>Contact information</h2>
        <ul>
          <li><strong>Phone:</strong> <a href="tel:+46762518572">+46 76 251 85 72</a></li>
          <li><strong>Email:</strong> <a href="mailto:se.southsoundmassage@gmail.com">se.southsoundmassage@gmail.com</a></li>
          <li><strong>Location:</strong> Lund / Skåne</li>
        </ul>
      </section>
    </main>

    <footer>
      <ul class="social-network-icons">
        <li>
          <a href="https://www.facebook.com/SouthSoundMassage" target="_blank" rel="noopener" aria-label="Facebook">
            <i class="fa-brands fa-facebook-square"></i>
          </a>
        </li>
        <li>
          <a href="index.html" aria-label="Home"><i class="fa-solid fa-house"></i></a>
        </li>
      </ul>

      <div id="copyright">
        <p>© 2022 South Sound Massage</p>
      </div>
    </footer>

    <script src="assets/JS/sheets-form.js"></script>
